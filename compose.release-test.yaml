# Isolated disposable database; does not use the development database or its volume.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: release_test
      POSTGRES_PASSWORD: release_test_local_only
      POSTGRES_DB: release_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U release_test -d release_test"]
      interval: 2s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://release_test:release_test_local_only@db:5432/release_test
      JWT_SECRET: release-test-only-secret-not-for-real-deployments
      CORS_ORIGINS: "[]"
    ports:
      - "127.0.0.1:18000:10000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10000/api/v1/ready', timeout=5)"]
      interval: 3s
      timeout: 6s
      retries: 20
